<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>News cover</title>
<!-- Source of the news covers (1672 x 941): node scripts/cover/make-cover.mjs, see its header.
     The text comes from the address: ?title=TypeR Studio&line=…&list=A|B|C -->
<style>
  @font-face { font-family: "Dela Gothic One"; src: url(../../public/assets/fonts/dela.woff2) format("woff2"); }
  @font-face { font-family: "Outfit"; src: url(../../public/assets/fonts/outfit-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1672px; height: 941px; overflow: hidden; background: #081236; }
  canvas { position: absolute; inset: 0; width: 1672px; height: 941px; }
  .card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 70px; color: #fff; }
  .brand { display: flex; align-items: center; gap: 34px; }
  .brand img { width: 196px; height: 196px; margin-top: -6px; filter: drop-shadow(0 10px 18px rgba(2, 8, 40, .55)) drop-shadow(0 0 40px rgba(120, 170, 255, .35)); }
  /* The trailer's depth: a thin blue extrusion down and to the right, lit from the top left */
  h1 { font: 400 158px/1 "Dela Gothic One"; letter-spacing: -.01em; white-space: nowrap; color: #fff;
       text-shadow: 1px 1px 0 #2a49d0, 2px 2px 0 #2643c4, 3px 3px 0 #223db6, 4px 4px 0 #1e37a8, 5px 5px 0 #1a3199, 6px 6px 0 #162b8a,
                    8px 10px 22px rgba(2, 6, 30, .5), 0 0 50px rgba(90, 140, 255, .25); }
  h1 .soft { color: #8cc8ff; }
  .line { display: flex; align-items: center; gap: 30px; margin-top: 34px; font: 600 52px/1 "Outfit"; letter-spacing: .005em; text-shadow: 0 0 24px rgba(120, 170, 255, .5), 0 3px 10px rgba(2, 6, 40, .5); }
  .line::before, .line::after { content: ""; width: 150px; height: 4px; border-radius: 2px; background: #9fd0ff; box-shadow: 0 0 14px rgba(140, 200, 255, .9); }
  .list { margin-top: 54px; font: 400 38px/1 "Outfit"; color: rgba(255, 255, 255, .95); text-shadow: 0 2px 10px rgba(2, 6, 40, .6); white-space: nowrap; }
  .list i { font-style: normal; color: #8cc8ff; margin: 0 .5em; }
</style>
</head>
<body>
<canvas id="bg" width="1672" height="941"></canvas>
<div class="card">
  <div class="brand"><img src="logo.png" alt=""><h1 id="title"></h1></div>
  <div class="line" id="line"></div>
  <div class="list" id="list"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  // The title's last word takes the lighter blue: TypeR Studio
  const title = q.get("title") || "TypeR Studio";
  const words = title.split(" ");
  const h1 = document.getElementById("title");
  h1.textContent = words.length > 1 ? words.slice(0, -1).join(" ") + " " : title;
  if (words.length > 1) { const s = document.createElement("span"); s.className = "soft"; s.textContent = words[words.length - 1]; h1.append(s); }
  document.getElementById("line").textContent = q.get("line") || "Mid-November update";
  const list = document.getElementById("list");
  (q.get("list") || "Flow mode|Auto Perspective|Actions|Clip Studio brushes").split("|").forEach((item, i) => {
    if (i) { const dot = document.createElement("i"); dot.textContent = "·"; list.append(dot); }
    list.append(item);
  });

  // The background: the trailer's stage, rays bursting from the middle, a screentone and sparkles
  const cv = document.getElementById("bg");
  const gl = cv.getContext("webgl", { preserveDrawingBuffer: true });
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, "attribute vec2 a; void main(){ gl_Position = vec4(a, 0., 1.); }"));
  // The trailer's stage shader and grade (TypeR-trailer, engine.js), as on its title card at 0:15
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `
    precision highp float;
    uniform vec2 uRes;
    const float T = 15.6;
    const vec3 A = vec3(.003, .004, .007), B = vec3(.007, .011, .026), C = vec3(.08, .26, 1.);
    const vec4 FX = vec4(.672, 0., .175, .5);   // beams, speed lines, screentone, rays
    float h1(float n){ return fract(sin(n * 127.1) * 43758.5453); }
    float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n1(float x){ float i = floor(x), f = fract(x); f = f * f * (3. - 2. * f); return mix(h1(i), h1(i + 1.), f); }
    float rays(float a){ return n1(a * 9. + T * .25) * .6 + n1(a * 23. - T * .4 + 4.) * .4; }
    void main(){
      vec2 p = (gl_FragCoord.xy - .5 * uRes) / uRes.y;
      vec2 q = p + vec2(sin(T * .21) * .03, cos(T * .17) * .02);
      float r = length(q * vec2(.8, 1.));
      vec3 c = mix(B, A, smoothstep(0., 1.05, r));
      // volumetric beams from above
      float x = q.x + q.y * .28;
      float b = pow(.5 + .5 * sin(x * 5.5 + T * .27 + 2. * sin(x * 1.9 - T * .19)), 5.) * .8
              + pow(.5 + .5 * sin(x * 11. + 1.7 - T * .21 + 1.3 * sin(x * 3.1 + T * .13)), 7.) * .45;
      b *= smoothstep(-.75, .62, q.y) * (1. - .25 * smoothstep(.3, .6, q.y));
      c += C * b * FX.x * .16;
      // god rays
      float rc = length(p); float ang = atan(p.y, p.x);
      // (blended across the angle's seam, on the left, so no line shows there)
      float ra = mix(rays(ang + 6.2832), rays(ang), smoothstep(-3.1416, -2.5, ang));
      c += C * pow(ra, 3.) * FX.w * 1.25 * exp(-rc * 1.55);
      // screentone
      vec2 ht = mat2(.7071, -.7071, .7071, .7071) * q * 62.;
      vec2 cell = fract(ht) - .5;
      float dr = .46 * smoothstep(1., .15, r + .1 * sin(T * .6));
      c += C * smoothstep(dr, dr - .05, length(cell)) * FX.z * .12;
      // dust: soft blue specks of every size
      for (int k = 0; k < 2; k++) {
        float cellPx = k == 0 ? 60. : 150.;
        vec2 g = gl_FragCoord.xy / uRes.y * 1080. / cellPx;
        vec2 id = floor(g) + float(k) * 17.;
        if (h2(id) > (k == 0 ? .9 : .82)) {
          vec2 at = floor(g) + .2 + .6 * vec2(h2(id + 3.1), h2(id + 7.7));
          float d = length(g - at) * cellPx;
          float size = k == 0 ? 1.5 + 2.5 * h2(id + 11.3) : 5. + 9. * h2(id + 11.3);
          c += vec3(.5, .65, 1.) * exp(-d * d / (size * size)) * (k == 0 ? .5 : .12) * (.4 + .6 * h2(id + 5.));
        }
      }
      // grade: highlight shoulder, cool shadows, vignette, sRGB, grain
      vec3 s = vec3(.82);
      c = min(c, s) + (1. - s) * (1. - exp(-max(c - s, 0.) / (1. - s)));
      float l = dot(c, vec3(.2126, .7152, .0722));
      c = mix(c, c * vec3(.94, .98, 1.08), (1. - smoothstep(0., .35, l)) * .8);
      vec2 uv = gl_FragCoord.xy / uRes - .5;
      c *= mix(1. - .42, 1., smoothstep(.95, .25, length(uv * vec2(1.05, 1.15))));
      c = pow(max(c, 0.), vec3(1. / 2.2));
      c += (h2(gl_FragCoord.xy * .37) - .5) * .012;
      gl_FragColor = vec4(c, 1.);
    }`));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(gl.getUniformLocation(prog, "uRes"), cv.width, cv.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  window.coverReady = true;
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TypeR 3.0 social card</title>
<!-- Source of public/og.png (1200 x 630): node scripts/make-og.mjs -->
<style>
  @font-face { font-family: "Dela Gothic One"; src: url(../public/assets/fonts/dela.woff2) format("woff2"); }
  @font-face { font-family: "Outfit"; src: url(../public/assets/fonts/outfit-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #0F1320; color: #ECEEF3; font-family: "Outfit", sans-serif; }
  .lines { position: absolute; inset: -10%; background: repeating-conic-gradient(from 0deg at 74% 50%, rgba(236,238,243,.06) 0deg .9deg, transparent .9deg 4.5deg); -webkit-mask-image: radial-gradient(ellipse 70% 80% at 74% 50%, #000 20%, transparent 75%); }
  .dots { position: absolute; left: -100px; bottom: -160px; width: 460px; height: 460px; background-image: radial-gradient(rgba(77,141,255,.45) 2px, transparent 2.5px); background-size: 14px 14px; -webkit-mask-image: radial-gradient(circle, #000 25%, transparent 68%); }
  .copy { position: absolute; left: 72px; top: 76px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 14px; font: 400 34px/1 "Dela Gothic One"; }
  .brand svg { width: 52px; height: 47px; }
  .brand .v { font: 600 20px/1 "Outfit"; color: #0B1430; background: #4D8DFF; padding: 6px 10px; border-radius: 6px; margin-left: 6px; }
  h1 { margin-top: 44px; font: 400 68px/1.02 "Dela Gothic One"; letter-spacing: -.015em; white-space: nowrap; }
  .done { position: relative; display: inline-grid; place-items: center; margin-top: 10px; padding: 18px 52px 30px; color: #111114; }
  .done svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .done path { fill: #F5F4EF; stroke: #111114; stroke-width: 3; vector-effect: non-scaling-stroke; }
  .done span { position: relative; font-size: 64px; }
  p { margin-top: 26px; font-size: 24px; line-height: 1.4; color: #C8CDD9; max-width: 30ch; }
  .page { position: absolute; left: 690px; top: 64px; width: 330px; transform: rotate(-3deg); box-shadow: -22px 26px 0 rgba(5,8,16,.6); }
  .page img { display: block; width: 100%; }
  .panel { position: absolute; left: 905px; top: 150px; width: 230px; transform: rotate(2deg); border: 1px solid #44495A; border-radius: 6px; overflow: hidden; box-shadow: -18px 22px 0 rgba(5,8,16,.6); }
  .panel img { display: block; width: 100%; }
  .sfx { position: absolute; left: 1000px; top: 448px; font: 400 80px/1 "Dela Gothic One"; color: #C9CDD6; -webkit-text-stroke: 4px #0F1320; paint-order: stroke fill; text-shadow: 6px 6px 0 #0F1320, 9px 9px 0 #4D8DFF; transform: rotate(-9deg); }
</style>
</head>
<body>
  <div class="lines"></div>
  <div class="dots"></div>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 40 36"><path fill="#F5F4EF" d="M20 2C9.5 2 2 8.3 2 16s7.5 14 18 14c1.4 0 2.8-.1 4-.4L32 35l-2.6-7.6C34.7 25 38 20.8 38 16 38 8.3 30.5 2 20 2z"/><text x="8.5" y="22" font-family="Georgia,serif" font-weight="700" font-size="15" fill="#111114">T</text><text x="19" y="24" font-family="Georgia,serif" font-weight="700" font-size="11" fill="#111114">R</text></svg>
      TypeR <span class="v">3.0</span>
    </div>
    <h1>Fewer clicks.<br>Faster pages.</h1>
    <div class="done"><svg viewBox="0 0 300 150" preserveAspectRatio="none"><path d="M150 6C72 6 8 36 8 74c0 25 27 47 68 59l-10 15 34-10c16 3 33 5 50 5 78 0 142-31 142-69S228 6 150 6z"/></svg><span style="font-family:'Dela Gothic One'">Done.</span></div>
    <p>The free Photoshop panel for manga and comics typesetters.</p>
  </div>
  <figure class="page"><img src="../public/images/hero-page.png" alt=""></figure>
  <figure class="panel"><img src="../public/images/hero-panel-head.png" alt=""><img src="../public/images/hero-panel-body.png" alt=""></figure>
  <span class="sfx">ドン!</span>
</body>
</html>
